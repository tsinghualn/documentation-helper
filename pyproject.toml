[project]
name = "documentation-helper"
version = "0.0.1"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4==4.13.4",
    "black==25.1.0",
    "tiktoken==0.9.0",
    "openai==1.93.1",
    "unstructured==0.18.3",
    "nltk==3.9.1",
    "fastapi==0.116.0",
    "jinja2==3.1.6",
    "uvicorn==0.35.0",
    "streamlit==1.46.1",
    "streamlit-chat==0.1.1",
    "tqdm==4.67.1",
    "isort==6.0.1",
    "langchainhub==0.1.21",
    "firecrawl-py==2.15.0",
    "langchain-community==0.3.27",
    "langsmith==0.4.4",
    "pillow==11.3.0",
    "langchain-tavily==0.2.7",
    "langchain-pinecone==0.2.8",
    "certifi==2025.6.15",
    "langchain-chroma==0.2.4",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = ["ipykernel==7.0.0a1"]

[tool.uv]
package = false
default-groups = "all"
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64' and platform_python_implementation == 'CPython'",
]
